name: Build 32-bit SO for CentOS 7

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build SO with Custom Dockerfile
      run: |
        cat << 'EOF' > Dockerfile.build
        FROM i386/centos:7

        # 修复 CentOS 7 官方源
        RUN sed -i s/mirror.centos.org/vault.centos.org/g /etc/yum.repos.d/CentOS-*.repo && \
            sed -i s/^#.*baseurl=http/baseurl=http/g /etc/yum.repos.d/CentOS-*.repo && \
            sed -i s/^mirrorlist=http/#mirrorlist=http/g /etc/yum.repos.d/CentOS-*.repo

        # 安装基础编译工具
        RUN yum install -y gcc make git curl glibc-devel

        # 安装 Rust
        RUN curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        ENV PATH="/root/.cargo/bin:${PATH}"

        WORKDIR /workspace
        COPY . .

        RUN cargo build --release
        EOF

        # 启动原生的 i386 CentOS 7 容器直接编译
        docker run --rm --platform linux/32bit/i386 -v ${{ github.workspace }}:/workspace centos:7 bash -c "
          sed -i s/mirror.centos.org/vault.centos.org/g /etc/yum.repos.d/CentOS-*.repo && \
          sed -i s/^#.*baseurl=http/baseurl=http/g /etc/yum.repos.d/CentOS-*.repo && \
          sed -i s/^mirrorlist=http/#mirrorlist=http/g /etc/yum.repos.d/CentOS-*.repo && \
          yum install -y gcc make git curl glibc-devel && \
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && \
          source \$HOME/.cargo/env && \
          cargo build --release
        "

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libdofslim-i686-centos7
        path: target/release/libdofslim.so
