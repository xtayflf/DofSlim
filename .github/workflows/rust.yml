name: Build 32-bit SO for CentOS 7

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: centos:7

    steps:
    - name: Prepare CentOS 7 repos
      run: |
        sed -i s/mirror.centos.org/vault.centos.org/g /etc/yum.repos.d/CentOS-*.repo
        sed -i s/^#.*baseurl=http/baseurl=http/g /etc/yum.repos.d/CentOS-*.repo
        sed -i s/^mirrorlist=http/#mirrorlist=http/g /etc/yum.repos.d/CentOS-*.repo

    - name: Install build tools and 32-bit glibc
      run: |
        yum install -y gcc glibc-devel.i686 git curl

    - name: Install Rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-host i686-unknown-linux-gnu

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build
      run: |
        source $HOME/.cargo/env
        cargo build --release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libdofslim-i686-centos7
        path: target/release/libdofslim.so
